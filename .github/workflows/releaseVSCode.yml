name: releaseVSCode

on:
  push:
    branches: [mojang/main]
    # Only run for changes within this plugin's directory.
    paths: ['FASTBuildMonitorVSCode/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/mojang/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FASTBuildMonitorVSCode
    steps:
      - uses: actions/checkout@v6
        with:
          # Release analysis needs history back to this plugin's previous release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run install:all
      - run: npm run build:all

      # Log into Azure CLI to get VSCE credentials
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_AZURE_CREDENTIAL: true